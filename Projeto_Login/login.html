<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1px solid black;
        padding: 20px;
        border-radius: 20px;
        width: fit-content;
      }
      .forms {
        display: flex;
        flex-direction: column;
      }
      .forms input {
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="card">
          <h2>login</h2>
          <form action="login.php" method="POST" class="forms">
            <label for="usuario">Digite o usuário</label>
            <input type="text" name="usuario" id="usuario" />
            <label for="senha">Digite a senha</label>
            <input type="password" name="senha" id="senha" />
            <input type="submit" />
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
